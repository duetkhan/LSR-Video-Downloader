
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .hidden {
      display: none !important;
    }

    .admin-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .admin-section {
      margin-bottom: 30px;
    }

    .admin-section h2 {
      margin-bottom: 15px;
    }

    .task-admin-form,
    .task-admin-card,
    .submission,
    .withdrawal {
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #ddd;
    }

    .task-admin-form input,
    .task-admin-form textarea,
    .task-admin-form select,
    .task-admin-card input,
    .task-admin-card textarea,
    .task-admin-card select {
      width: 100%;
      box-sizing: border-box;
      margin: 7px 0;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .task-admin-form textarea,
    .task-admin-card textarea {
      min-height: 90px;
      resize: vertical;
    }

    .task-admin-card button,
    .task-admin-form button,
    .submission button,
    .withdrawal button {
      margin: 5px 5px 5px 0;
    }

    .approve {
      background: #198754;
      color: white;
    }

    .reject {
      background: #dc3545;
      color: white;
    }

    .admin-logout {
      background: #dc3545;
      color: white;
    }

    .status {
      padding: 15px;
      margin: 10px 0;
      border-radius: 7px;
      background: #f5f5f5;
    }

    .proof {
      padding: 15px;
      margin: 15px 0;
      background: #f7f7f7;
      border-radius: 7px;
      word-break: break-word;
    }

    hr {
      margin: 25px 0;
      border: 0;
      border-top: 1px solid #ddd;
    }

  </style>

</head>


<body>


  <!-- =========================
       ACCESS CHECK
  ========================= -->

  <div
    id="accessStatus"
    class="status"
    style="max-width:700px;margin:50px auto;text-align:center;"
  >

    Checking admin access...

  </div>



  <!-- =========================
       ADMIN PANEL
  ========================= -->

  <main
    id="adminPanel"
    class="admin-container hidden"
  >


    <!-- HEADER -->

    <div class="admin-header">

      <div>

        <h1>
          Admin Panel
        </h1>

        <p>
          Welcome,
          <strong id="adminName">
            Admin
          </strong>
        </p>

      </div>


      <button
        type="button"
        class="admin-logout"
        onclick="adminLogout()"
      >
        🚪 Logout
      </button>

    </div>



    <!-- =========================
         TASK MANAGEMENT
    ========================= -->

    <section class="admin-section">

      <h2>
        📝 Task Management
      </h2>

      <div
        id="taskList"
      >

        <div class="status">
          Loading tasks...
        </div>

      </div>

    </section>



    <!-- =========================
         SUBMISSIONS
    ========================= -->

    <section class="admin-section">

      <h2>
        📋 Pending Task Submissions
      </h2>

      <div
        id="submissionList"
      >

        <div class="status">
          Loading submissions...
        </div>

      </div>

    </section>



    <!-- =========================
         WITHDRAWALS
    ========================= -->

    <section class="admin-section">

      <h2>
        💸 Pending Withdrawals
      </h2>

      <div
        id="withdrawalList"
      >

        <div class="status">
          Loading withdrawals...
        </div>

      </div>

    </section>


  </main>



  <!-- =========================
       SUPABASE
  ========================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =========================
       CONFIG
  ========================= -->

  <script src="supabase-config.js"></script>


  <!-- =========================
       ADMIN JS
  ========================= -->

  <script src="admin.js"></script>


</body>

</html>
