<!-- ===== ACCOUNT SYSTEM ===== -->

<script>

let accountSupabase = null;


/* =========================
   START
   ========================= */

document.addEventListener(
  "DOMContentLoaded",
  async function () {

    try {

      if (
        typeof supabase === "undefined"
      ) {
        console.error(
          "Supabase library not loaded."
        );
        return;
      }

      accountSupabase =
        supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

      await updateAccountUI();


      /* Detect login/logout automatically */

      accountSupabase.auth.onAuthStateChange(
        function () {

          setTimeout(
            updateAccountUI,
            0
          );

        }
      );

    } catch (error) {

      console.error(
        "Account system error:",
        error
      );

    }

  }
);


/* =========================
   UPDATE ACCOUNT
   ========================= */

async function updateAccountUI() {

  if (!accountSupabase) return;


  const {
    data: {
      user
    }
  } =
    await accountSupabase.auth.getUser();


  const nameElement =
    document.getElementById(
      "accountName"
    );

  const emailElement =
    document.getElementById(
      "accountEmail"
    );

  const balanceElement =
    document.getElementById(
      "accountBalance"
    );

  const guestButtons =
    document.getElementById(
      "guestButtons"
    );

  const userButtons =
    document.getElementById(
      "userButtons"
    );


  /* =========================
     GUEST
     ========================= */

  if (!user) {

    nameElement.textContent =
      "Guest";

    emailElement.textContent =
      "";

    emailElement.style.display =
      "none";

    balanceElement.textContent =
      "0";

    guestButtons.style.display =
      "flex";

    userButtons.style.display =
      "none";

    return;
  }


  /* =========================
     USERNAME
     ========================= */

  let username =
    user.user_metadata?.username ||
    user.user_metadata?.full_name ||
    "";


  /*
    Get username from profiles
  */

  try {

    const {
      data: profile,
      error
    } =
      await accountSupabase
        .from("profiles")
        .select(
          "username, full_name"
        )
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if (!error && profile) {

      username =
        profile.username ||
        profile.full_name ||
        username;

    }

  } catch (error) {

    console.error(
      "Profile loading error:",
      error
    );

  }


  /*
    Fallback to email username
  */

  if (!username) {

    username =
      user.email
        ? user.email.split("@")[0]
        : "User";

  }


  nameElement.textContent =
    username;


  /* =========================
     EMAIL
     ========================= */

  emailElement.textContent =
    user.email || "";

  emailElement.style.display =
    user.email
      ? "block"
      : "none";


  /* =========================
     BALANCE
     ========================= */

  let balance = 0;


  try {

    const {
      data: wallet,
      error
    } =
      await accountSupabase
        .from("wallets")
        .select("balance")
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if (!error && wallet) {

      balance =
        Number(
          wallet.balance || 0
        );

    }

  } catch (error) {

    console.error(
      "Wallet loading error:",
      error
    );

  }


  balanceElement.textContent =
    balance;


  /* =========================
     BUTTONS
     ========================= */

  guestButtons.style.display =
    "none";

  userButtons.style.display =
    "flex";

}


/* =========================
   LOGOUT
   ========================= */

async function logoutUser() {

  if (!accountSupabase) return;


  const {
    error
  } =
    await accountSupabase.auth.signOut();


  if (error) {

    alert(
      "Logout failed: " +
      error.message
    );

    console.error(error);

    return;
  }


  await updateAccountUI();

}

</script>
