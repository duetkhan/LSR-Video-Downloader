<script>

let supabaseClient = null;
let currentUser = null;



/* =========================
   INIT
========================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );



    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();



    if (
      session &&
      session.user
    ) {

      currentUser =
        session.user;

      await loadWallet();
      await loadWithdrawals();

    } else {

      showLoggedOut();

    }

  }
);



/* =========================
   LOGGED OUT
========================= */

function showLoggedOut() {

  document
    .getElementById("withdrawCard")
    .classList.add("hidden");



  document
    .getElementById("loginMessage")
    .classList.remove("hidden");

}



/* =========================
   WALLET
========================= */

async function loadWallet() {

  if (!currentUser) return;



  const {
    data,
    error
  } =
    await supabaseClient
      .from("wallets")
      .select(
        "balance"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();



  if (error) {

    console.error(error);

    return;

  }



  document
    .getElementById("balance")
    .textContent =
      Number(
        data?.balance || 0
      );

}



/* =========================
   WITHDRAW
========================= */

async function requestWithdrawal() {

  if (!currentUser) {

    window.location.href =
      "login.html";

    return;

  }



  const amount =
    Number(
      document
        .getElementById(
          "withdrawAmount"
        )
        .value
    );



  const method =
    document
      .getElementById(
        "withdrawMethod"
      )
      .value;



  const accountDetails =
    document
      .getElementById(
        "accountDetails"
      )
      .value
      .trim();



  const message =
    document
      .getElementById(
        "withdrawMessage"
      );



  if (
    !Number.isInteger(amount) ||
    amount <= 0
  ) {

    message.innerHTML =
      `<div class="status">
        Enter a valid withdrawal amount.
      </div>`;

    return;

  }



  /* =========================
     MINIMUM WITHDRAWAL
  ========================= */

  if (amount < 110) {

    message.innerHTML =
      `<div class="status">
        Minimum withdrawal amount is 110 Coins.
      </div>`;

    return;

  }



  if (!method) {

    message.innerHTML =
      `<div class="status">
        Select a payment method.
      </div>`;

    return;

  }



  if (!accountDetails) {

    message.innerHTML =
      `<div class="status">
        Enter your payment account.
      </div>`;

    return;

  }



  message.innerHTML =
    `<div class="status">
      Processing...
    </div>`;



  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "request_withdrawal",
      {
        p_amount: amount,
        p_method: method,
        p_account_details:
          accountDetails
      }
    );



  if (error) {

    console.error(error);

    message.innerHTML =
      `<div class="status">
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }



  message.innerHTML =
    `<div class="status">
      ✅ Withdrawal request submitted successfully.
    </div>`;



  document
    .getElementById(
      "withdrawAmount"
    )
    .value = "";



  document
    .getElementById(
      "accountDetails"
    )
    .value = "";



  await loadWallet();
  await loadWithdrawals();

}



/* =========================
   HISTORY
========================= */

async function loadWithdrawals() {

  if (!currentUser) return;



  const list =
    document.getElementById(
      "withdrawalList"
    );



  const {
    data,
    error
  } =
    await supabaseClient
      .from("withdrawals")
      .select(`
        id,
        amount,
        method,
        status,
        requested_at,
        processed_at,
        admin_note
      `)
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "requested_at",
        {
          ascending: false
        }
      );



  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="status">
        Unable to load withdrawal history.
      </div>`;

    return;

  }



  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML =
      `<div class="status">
        No withdrawal requests yet.
      </div>`;

    return;

  }



  list.innerHTML =
    data.map(
      item => {

        return `

          <div class="history-item">

            💸

            <span class="coin">
              ${Number(
                item.amount
              )} Coins
            </span>

            <br><br>

            Method:
            ${escapeHtml(
              item.method
            )}

            <br>

            Status:
            <strong>
              ${escapeHtml(
                item.status
              )}</strong>

            <br>

            Requested:
            ${formatDate(
              item.requested_at
            )}

            ${
              item.admin_note
                ? `
                  <br>
                  Note:
                  ${escapeHtml(
                    item.admin_note
                  )}
                `
                : ""
            }

          </div>

        `;

      }
    ).join("");

}



/* =========================
   HELPERS
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



function formatDate(value) {

  if (!value) return "";

  return new Date(
    value
  ).toLocaleString();

}
