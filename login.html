<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Micro Tasks</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .auth-container {
      max-width: 420px;
      margin: 70px auto;
      padding: 25px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .login-btn {
      background: #222;
      color: white;
    }

    .signup-btn {
      background: #eee;
      color: #222;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="auth-container">

    <h1>🔐 Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      onclick="loginUser()"
    >
      Login
    </button>

    <button
      class="signup-btn"
      onclick="location.href='signup.html'"
    >
      Create Account
    </button>

    <div
      class="message"
      id="message"
    ></div>

    <a
      class="back"
      href="tasks.html"
    >
      ← Back to Micro Tasks
    </a>

  </div>


<script>

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


async function loginUser() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if (!email || !password) {

    message.textContent =
      "Please enter email and password.";

    return;
  }


  message.textContent =
    "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    console.error(error);

    message.textContent =
      error.message;

    return;
  }


  message.textContent =
    "Login successful!";


  setTimeout(() => {

    window.location.href =
      "tasks.html";

  }, 700);
}

</script>

</body>
</html>
