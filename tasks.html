
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Micro Tasks - LSR</title>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
    }


    a {
      color: inherit;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      padding: 25px 15px;
      text-align: center;
      background: #191919;
      border-bottom: 1px solid #333;
    }


    header h1 {
      margin: 0;
      font-size: 34px;
    }


    header p {
      margin: 8px 0 0;
      color: #ccc;
    }


    /* =========================
       USER BAR
    ========================= */

    .user-bar {
      max-width: 1000px;
      margin: 18px auto;
      padding: 14px 18px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;

      background: #191919;
      border-radius: 12px;
      border: 1px solid #333;
    }


    .user-left {
      display: flex;
      align-items: center;
      gap: 8px;

      min-width: 0;
      flex: 1;
    }


    .username {
      font-weight: bold;
      color: #fff;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .user-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 8px;
      flex-wrap: wrap;
    }


    .balance {
      color: #ffd43b;
      font-weight: bold;
      white-space: nowrap;
    }


    /* =========================
       BUTTONS
    ========================= */

    button,
    .nav-btn {
      border: none;
      border-radius: 8px;

      padding: 10px 14px;

      cursor: pointer;

      text-decoration: none;

      display: inline-block;

      font-size: 14px;
    }


    .login-btn {
      background: #2563eb;
      color: #fff;
    }


    .signup-btn {
      background: #16a34a;
      color: #fff;
    }


    .logout-btn {
      background: #555;
      color: #fff;
    }


    .withdraw-btn {
      background: #f59e0b;
      color: #111;

      font-weight: bold;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 1000px;

      margin: auto;

      padding: 10px 18px 40px;
    }


    .hero {
      text-align: center;

      padding: 20px 10px;
    }


    .hero h2 {
      font-size: 32px;

      margin: 5px 0;
    }


    .hero p {
      color: #ccc;

      margin: 5px 0;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      background: #242424;

      padding: 15px;

      border-radius: 10px;

      margin: 10px 0;

      color: #eee;
    }


    /* =========================
       TASKS
    ========================= */

    .section-title {
      margin-top: 35px;

      font-size: 27px;
    }


    .task-card {
      background: #1b1b1b;

      border: 1px solid #333;

      border-radius: 14px;

      padding: 20px;

      margin: 15px 0;
    }


    .task-card h3 {
      margin-top: 0;

      font-size: 22px;
    }


    .task-card p {
      color: #ddd;

      line-height: 1.5;
    }


    .reward {
      color: #ffd43b;

      font-weight: bold;
    }


    .start-task {
      background: #2563eb;

      color: white;

      font-weight: bold;
    }


    .submit-task {
      background: #16a34a;

      color: white;

      font-weight: bold;
    }


    .task-details {
      margin-top: 18px;

      padding-top: 15px;

      border-top: 1px solid #333;
    }


    .task-details textarea {
      width: 100%;

      min-height: 100px;

      resize: vertical;

      padding: 12px;

      border-radius: 8px;

      border: 1px solid #555;

      background: #111;

      color: white;

      margin: 10px 0;
    }


    .task-link {
      display: inline-block;

      background: #9333ea;

      color: white;

      padding: 10px 14px;

      border-radius: 8px;

      text-decoration: none;

      margin: 8px 0;
    }


    .hidden {
      display: none !important;
    }


    /* =========================
       HISTORY
    ========================= */

    .history-item {
      background: #1b1b1b;

      border: 1px solid #333;

      border-radius: 10px;

      padding: 14px;

      margin: 10px 0;
    }


    /* =========================
       ADS
    ========================= */

    .ad-box {
      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      margin: 20px auto;

      overflow: hidden;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;

      padding: 25px;

      color: #888;

      border-top: 1px solid #222;

      margin-top: 30px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      header h1 {
        font-size: 27px;
      }


      .user-bar {
        align-items: center;

        padding: 12px;
      }


      .user-left {
        min-width: 0;
      }


      .user-right {
        flex-shrink: 0;

        justify-content: flex-end;
      }


      .user-right button,
      .user-right a {
        text-align: center;
      }


      .balance {
        width: 100%;

        text-align: right;

        margin-bottom: 3px;
      }


      .hero h2 {
        font-size: 27px;
      }

    }


    @media (max-width: 430px) {

      .user-bar {
        flex-direction: row;

        align-items: flex-start;
      }


      .user-left {
        padding-top: 8px;
      }


      .user-right {
        flex-direction: column;

        align-items: stretch;
      }


      .balance {
        text-align: center;
      }


      .user-right button,
      .user-right a {
        width: 100%;
      }

    }

  </style>

</head>


<body>

</body>
