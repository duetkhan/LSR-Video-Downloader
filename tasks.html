```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Micro Tasks</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 15px;
    }

    h1,
    h2 {
      text-align: center;
    }

    /* =========================
       USER BOX
       ========================= */

    .user-box {
      background: #fff;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .user-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .user-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #eee;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;
      flex-shrink: 0;
    }

    .username {
      font-size: 20px;
      font-weight: bold;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-email {
      margin-top: 4px;
      color: #777;
      font-size: 13px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }

    .balance-box {
      text-align: right;
      flex-shrink: 0;
    }

    .balance-label {
      color: #777;
      font-size: 13px;
    }

    .balance-value {
      color: #d99b00;
      font-size: 20px;
      font-weight: bold;
      margin-top: 3px;
    }

    /* =========================
       AUTH BUTTONS
       ========================= */

    .auth-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .auth-buttons a,
    .auth-buttons button {
      flex: 1;
      min-width: 100px;

      padding: 12px;
      border: 0;
      border-radius: 9px;

      text-align: center;
      text-decoration: none;

      font-size: 15px;
      cursor: pointer;
    }

    .login-btn {
      background: #2563eb;
      color: #fff;
    }

    .signup-btn {
      background: #16a34a;
      color: #fff;
    }

    .withdraw-btn {
      background: #f59e0b;
      color: #111;
    }

    .logout-btn {
      background: #dc2626;
      color: #fff;
    }

    /* =========================
       TASK CARD
       ========================= */

    .task-card {
      background: #fff;
      padding: 18px;
      margin: 15px 0;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .task-card h3 {
      margin-top: 0;
    }

    .reward,
    .coin {
      font-weight: bold;
      color: #d99b00;
    }

    .task-card button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: #fff;
      cursor: pointer;
      margin-top: 8px;
    }

    .task-card a {
      display: inline-block;
      margin: 8px 0;
      color: #2563eb;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .status {
      background: #fff;
      padding: 13px;
      border-radius: 10px;
      margin: 10px 0;
    }

    .back {
      display: block;
      text-align: center;
      margin: 25px 0;
      text-decoration: none;
      color: #2563eb;
    }

    @media (max-width: 600px) {

      .user-box {
        padding: 13px;
      }

      .username {
        font-size: 17px;
        max-width: 160px;
      }

      .user-email {
        max-width: 160px;
        font-size: 12px;
      }

      .balance-value {
        font-size: 17px;
      }

      .auth-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🪙 Micro Tasks</h1>


  <!-- =========================
       USER BOX
       ========================= -->

  <div class="user-box">

    <div class="user-left">

      <div class="user-icon">
        👤
      </div>

      <div>

        <div
          id="displayUsername"
          class="username"
        >
          Guest
        </div>

        <div
          id="displayEmail"
          class="user-email"
          style="display:none;"
        ></div>

      </div>

    </div>


    <div class="balance-box">

      <div class="balance-label">
        Balance
      </div>

      <div class="balance-value">
        <span id="balance">0</span> Coins
      </div>

    </div>

  </div>


  <!-- =========================
       GUEST BUTTONS
       ========================= -->

  <div
    id="guestButtons"
    class="auth-buttons"
  >

    <a
      href="login.html"
      class="login-btn"
    >
      Login
    </a>

    <a
      href="signup.html"
      class="signup-btn"
    >
      Sign Up
    </a>

    <a
      href="withdraw.html"
      class="withdraw-btn"
    >
      💸 Withdraw
    </a>

  </div>


  <!-- =========================
       LOGGED-IN BUTTONS
       ========================= -->

  <div
    id="userButtons"
    class="auth-buttons"
    style="display:none;"
  >

    <button
      type="button"
      class="logout-btn"
      onclick="logoutUser()"
    >
      Logout
    </button>

    <a
      href="withdraw.html"
      class="withdraw-btn"
    >
      💸 Withdraw
    </a>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="userStatus"></div>


  <!-- =========================
       TASKS
       ========================= -->

  <h2>
    📋 Available Tasks
  </h2>

  <div id="taskList">
    <div class="status">
      Loading tasks...
    </div>
  </div>


  <!-- =========================
       SUBMISSIONS
       ========================= -->

  <h2>
    📜 My Task History
  </h2>

  <div id="submissionList">
    <div class="status">
      Login to view your task history.
    </div>
  </div>


  <a
    href="index.html"
    class="back"
  >
    ← Back to Home
  </a>

</div>


<script src="tasks.js"></script>

</body>
</html>
```
