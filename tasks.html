<!-- =========================
     AUTH UI SCRIPT
     This only controls
     username / balance /
     login / signup / logout
========================= -->

<script>

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const usernameElement =
  document.getElementById("username");

const balanceElement =
  document.getElementById("balance");

const loginButton =
  document.getElementById("loginButton");

const signupButton =
  document.getElementById("signupButton");

const logoutButton =
  document.getElementById("logoutButton");


/* =========================
   GUEST UI
========================= */

function showGuest() {

  usernameElement.textContent = "Guest";

  balanceElement.textContent = "0";

  loginButton.classList.remove("hidden");

  signupButton.classList.remove("hidden");

  logoutButton.classList.add("hidden");
}


/* =========================
   LOGGED-IN UI
========================= */

async function showLoggedIn(user) {

  loginButton.classList.add("hidden");

  signupButton.classList.add("hidden");

  logoutButton.classList.remove("hidden");


  /*
    Get profile using auth user ID
  */

  const { data: profile, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();


  if (error) {

    console.error(
      "Profile error:",
      error
    );

    /*
      Even if profile loading fails,
      don't show Guest after login.
    */

    usernameElement.textContent =
      user.email
        ? user.email.split("@")[0]
        : "User";

    balanceElement.textContent = "0";

    return;
  }


  if (profile) {

    /*
      Username
    */

    usernameElement.textContent =
      profile.username ||
      profile.full_name ||
      (
        user.email
          ? user.email.split("@")[0]
          : "User"
      );


    /*
      Balance

      Supports common column names
      without changing your database.
    */

    let userBalance = 0;


    if (
      profile.balance !== undefined &&
      profile.balance !== null
    ) {

      userBalance = profile.balance;

    }

    else if (
      profile.coins !== undefined &&
      profile.coins !== null
    ) {

      userBalance = profile.coins;

    }

    else if (
      profile.points !== undefined &&
      profile.points !== null
    ) {

      userBalance = profile.points;

    }


    balanceElement.textContent =
      Number(userBalance) || 0;

  }

  else {

    usernameElement.textContent =
      user.email
        ? user.email.split("@")[0]
        : "User";

    balanceElement.textContent = "0";

  }

}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();


  if (user) {

    await showLoggedIn(user);

  }

  else {

    showGuest();

  }

}


/* =========================
   LOGOUT
========================= */

async function logoutUser() {

  logoutButton.disabled = true;

  logoutButton.textContent =
    "Logging out...";


  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if (error) {

    console.error(error);

    alert(
      "Logout failed: " +
      error.message
    );

    logoutButton.disabled = false;

    logoutButton.textContent =
      "Logout";

    return;
  }


  showGuest();

  logoutButton.disabled = false;

  logoutButton.textContent =
    "Logout";

}


/* =========================
   AUTH STATE LISTENER
========================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (
      session &&
      session.user
    ) {

      await showLoggedIn(
        session.user
      );

    }

    else {

      showGuest();

    }

  }
);


/* =========================
   START
========================= */

checkLogin();

</script>
